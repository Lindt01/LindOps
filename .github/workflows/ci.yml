name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-validate:
    name: Validate compose file
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker Compose version
        run: docker compose version

      - name: Use example env
        run: cp compose/.env.example compose/.env

      - name: Validate
        run: docker compose -f compose/docker-compose.yml config --quiet

  compose-rules:
    name: Compose rules (unit tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run unit tests
        run: pytest tests/unit -v

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [compose-validate, compose-rules]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use example env
        run: cp compose/.env.example compose/.env

      - name: Start stack and wait until healthy
        run: docker compose -f compose/docker-compose.yml up -d --wait --wait-timeout 300

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run integration tests
        run: pytest tests/integration -v

      - name: Show container status and logs
        if: failure()
        run: |
          docker compose -f compose/docker-compose.yml ps
          docker compose -f compose/docker-compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f compose/docker-compose.yml down -v