name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-validate:
    name: Compose-Datei prüfen
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Docker-Compose-Version anzeigen
        run: docker compose version

      - name: Beispiel-Env bereitstellen
        run: cp compose/.env.example compose/.env

      - name: Compose-Datei validieren
        run: docker compose -f compose/docker-compose.yml config --quiet

  compose-rules:
    name: Compose-Regeln (Unit-Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test-Abhängigkeiten installieren
        run: pip install -r tests/requirements.txt

      - name: Tests ausführen
        run: pytest tests/unit -v

  integration:
    name: Integrationstests (Stack starten)
    runs-on: ubuntu-latest
    needs: [compose-validate, compose-rules]

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Beispiel-Env bereitstellen
        run: cp compose/.env.example compose/.env

      - name: Stack starten und warten, bis alle Dienste healthy sind
        run: docker compose -f compose/docker-compose.yml up -d --wait --wait-timeout 300

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test-Abhängigkeiten installieren
        run: pip install -r tests/requirements.txt

      - name: Integrationstests ausführen
        run: pytest tests/integration -v

      - name: Container-Status und Logs bei Fehler anzeigen
        if: failure()
        run: |
          docker compose -f compose/docker-compose.yml ps
          docker compose -f compose/docker-compose.yml logs --no-color

      - name: Stack aufräumen
        if: always()
        run: docker compose -f compose/docker-compose.yml down -v