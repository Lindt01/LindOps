# LindOps - Phase 1: local services with Docker Compose
# Start:  docker compose up -d
# Stop:   docker compose down

name: lindops

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.11
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test: ["CMD", "/app/extra/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

  vaultwarden:
    image: vaultwarden/server:1.37.5
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DOMAIN: "http://localhost:8080"
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED}"
      ADMIN_TOKEN: "${VAULTWARDEN_ADMIN_TOKEN}"
    volumes:
      - vaultwarden-data:/data
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s

  gitea:
    image: gitea/gitea:28.3.0
    container_name: gitea
    restart: unless-stopped
    ports:
      - "3000:3000"   # web UI
      - "2222:22"     # git over SSH
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s

volumes:
  uptime-kuma-data:
  vaultwarden-data:
  gitea-data: